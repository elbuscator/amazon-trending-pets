
name: Enviar top Mascotas

on:
  schedule:
    - cron: "00 19 * * *"   # Ejecución diaria, 30 minutos después de Hogar
  workflow_dispatch:
    inputs:
      force_publish:
        description: "Forzar publicación (ignora los umbrales adaptativos)"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  send_pets:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            python-telegram-bot==20.8 \
            httpx==0.26.0 anyio==4.4.0 \
            beautifulsoup4 requests curl_cffi

      - name: Ejecutar bot
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID_PETS }}
          ASSOCIATE_TAG: ${{ secrets.ASSOCIATE_TAG }}
          FORCE_PUBLISH: ${{ inputs.force_publish && '1' || '' }}
        run: python main.py

      - name: Commitear estado
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add previous_ranking.json last_products.json 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "Sin cambios en el estado."
          else
            git commit -m "chore: estado mascotas [skip ci]"
            git pull --rebase || true
            git push
          fi
